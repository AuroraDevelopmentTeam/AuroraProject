bot:
  prefix: "!"
  version: "2.0.0"
  default_locale: "en"
  token: "YOUR_BOT_TOKEN_HERE"  # Replace with your actual bot token
  intents:
    - "GUILDS"
    - "GUILD_MESSAGES"
    - "GUILD_MEMBERS"
    - "MESSAGE_CONTENT"
    - "GUILD_PRESENCES"
    - "GUILD_VOICE_STATES"

redis:
  host: "localhost"
  port: 6379
  db: 0
  password: null
  max_connections: 10
  socket_timeout: 5
  socket_connect_timeout: 5

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/aurorabot.log"
  max_size: 10485760  # 10MB
  backup_count: 5

features:
  default_currency: "💎"
  default_starting_balance: 100
  default_payday_amount: 200
  default_min_exp: 1
  default_max_exp: 3
  level_up_messages: true
  welcome_messages: true
  goodbye_messages: true
  nitro_messages: true
